<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suraj Kiran Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-side"><a class="brand" href="index.html">Suraj Kiran</a><p class="eyebrow">ADMIN</p><button class="side-active">Products</button><button>Homepage</button><button>Enquiries</button><button>Orders (future)</button><a href="index.html">View website →</a></aside><main class="admin-main"><div class="admin-top"><div><span class="eyebrow">CONTROL CENTRE</span><h1>Products</h1></div><button class="btn btn-primary" id="newProduct">+ Add Product</button></div><div class="admin-note"><strong>Demo admin mode</strong><span>This first version stores changes in this browser only. A secure cloud database/authentication will be connected in the next backend phase.</span></div><div class="admin-grid"><section class="panel"><h2>Product catalogue</h2><div id="adminProducts"></div></section><section class="panel" id="editor"><h2>Add / Edit Product</h2><form id="productForm"><input type="hidden" id="pId"><label>Product name<input id="pName" required></label><label>Category<select id="pCategory"><option>Black Tea</option><option>Green Tea</option><option>Herbal Tea</option><option>Specialty Tea</option></select></label><label>Price (₹)<input id="pPrice" type="number" min="0" required></label><label>Pack size<input id="pSize" placeholder="e.g. 250 g"></label><label>Description<textarea id="pDesc" rows="4" required></textarea></label><label>Image URL<input id="pImage" placeholder="https://..."></label><div class="actions"><button class="btn btn-primary">Save Product</button><button type="button" class="btn btn-ghost" id="resetForm">Clear</button></div></form></section></div></main></div><script src="app.js"></script></body></html>
